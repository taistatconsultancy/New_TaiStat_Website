<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Admin - TaiStat</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="../assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background: #f5f7fa;
      color: #1a1a1a;
    }
    
    .admin-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }
    
    .admin-header {
      background: linear-gradient(135deg, #4A1DE1 0%, #3000D2 100%);
      color: white;
      padding: 2rem;
      border-radius: 12px;
      margin-bottom: 2rem;
      box-shadow: 0 4px 12px rgba(74, 29, 225, 0.2);
    }
    
    .admin-header h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    
    .admin-header p {
      opacity: 0.9;
    }
    
    .admin-actions {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    
    .btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .btn-primary {
      background: #4A1DE1;
      color: white;
    }
    
    .btn-primary:hover {
      background: #3000D2;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(74, 29, 225, 0.3);
    }
    
    .btn-success {
      background: #15be56;
      color: white;
    }
    
    .btn-danger {
      background: #ee6c20;
      color: white;
    }
    
    .btn-secondary {
      background: #6c757d;
      color: white;
    }
    
    .blogs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    
    .blog-card {
      background: white;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      transition: all 0.3s;
    }
    
    .blog-card:hover {
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      transform: translateY(-2px);
    }
    
    .blog-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 1rem;
    }
    
    .blog-card h3 {
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
      color: #1a1a1a;
    }
    
    .blog-card .meta {
      font-size: 0.875rem;
      color: #6c757d;
      margin-bottom: 1rem;
    }
    
    .blog-card .actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
    }
    
    .blog-card .actions .btn {
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
    }
    
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      overflow-y: auto;
    }
    
    .modal.active {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    
    .modal-content {
      background: white;
      border-radius: 12px;
      padding: 2rem;
      max-width: 800px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }
    
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    
    .modal-header h2 {
      font-size: 1.75rem;
      font-weight: 700;
    }
    
    .close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #6c757d;
    }
    
    .form-group {
      margin-bottom: 1.5rem;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: #1a1a1a;
    }
    
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 0.75rem;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-family: inherit;
      font-size: 1rem;
      transition: border-color 0.3s;
    }
    
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: #4A1DE1;
    }
    
    .form-group textarea {
      min-height: 150px;
      resize: vertical;
    }
    
    .form-group #content {
      min-height: 300px;
    }
    
    .image-upload {
      border: 2px dashed #e5e7eb;
      border-radius: 8px;
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .image-upload:hover {
      border-color: #4A1DE1;
      background: #f5f8ff;
    }
    
    .image-upload img {
      max-width: 100%;
      max-height: 300px;
      border-radius: 8px;
      margin-top: 1rem;
    }
    
    .image-preview {
      display: none;
    }
    
    .image-preview.active {
      display: block;
    }
    
    .tags-input {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      padding: 0.75rem;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      min-height: 50px;
    }
    
    .tag {
      background: #4A1DE1;
      color: white;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.875rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .tag .remove {
      cursor: pointer;
      font-weight: bold;
    }
    
    .alert {
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }
    
    .alert-success {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #10b981;
    }
    
    .alert-error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #ef4444;
    }
    
    .loading {
      text-align: center;
      padding: 2rem;
      color: #6c757d;
    }
    
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: #6c757d;
    }
    
    .empty-state i {
      font-size: 4rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <div class="admin-header">
      <h1><i class="bi bi-journal-text"></i> Blog Management</h1>
      <p>Manage your blog posts, create new content, and update existing articles</p>
    </div>

    <div id="alert-container"></div>

    <div class="admin-actions">
      <button class="btn btn-primary" onclick="openCreateModal()">
        <i class="bi bi-plus-circle"></i> Create New Blog
      </button>
      <button class="btn btn-secondary" onclick="loadBlogs()">
        <i class="bi bi-arrow-clockwise"></i> Refresh
      </button>
    </div>

    <div id="blogs-container" class="loading">
      <p>Loading blogs...</p>
    </div>
  </div>

  <!-- Create/Edit Modal -->
  <div id="blogModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Create New Blog</h2>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      
      <form id="blogForm" onsubmit="saveBlog(event)">
        <input type="hidden" id="blogId">
        
        <div class="form-group">
          <label for="title">Title *</label>
          <input type="text" id="title" required>
        </div>

        <div class="form-group">
          <label for="excerpt">Excerpt</label>
          <textarea id="excerpt" rows="3"></textarea>
        </div>

        <div class="form-group">
          <label for="content">Content *</label>
          <textarea id="content" required></textarea>
        </div>

        <div class="form-group">
          <label for="featuredImage">Featured Image</label>
          <div class="image-upload" onclick="document.getElementById('imageInput').click()">
            <input type="file" id="imageInput" accept="image/*" style="display: none" onchange="handleImageUpload(event)">
            <div id="imageUploadText">
              <i class="bi bi-cloud-upload" style="font-size: 2rem; color: #6c757d;"></i>
              <p>Click to upload image</p>
            </div>
            <div id="imagePreview" class="image-preview">
              <img id="previewImg" src="" alt="Preview">
            </div>
          </div>
          <input type="hidden" id="featuredImageUrl">
        </div>

        <div class="form-group">
          <label for="author">Author</label>
          <input type="text" id="author" value="Stephen Mulingwa">
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <select id="category">
            <option value="">Select Category</option>
            <option value="Machine Learning">Machine Learning</option>
            <option value="Data Science">Data Science</option>
            <option value="Artificial Intelligence">Artificial Intelligence</option>
            <option value="Technology">Technology</option>
            <option value="Sales">Sales</option>
            <option value="Data Collection">Data Collection</option>
            <option value="APIs">APIs</option>
          </select>
        </div>

        <div class="form-group">
          <label for="tags">Tags (Press Enter to add)</label>
          <div class="tags-input" id="tagsContainer">
            <input type="text" id="tagInput" placeholder="Add tag and press Enter" onkeypress="addTag(event)">
          </div>
          <input type="hidden" id="tags">
        </div>

        <div class="form-group">
          <label>
            <input type="checkbox" id="published" checked> Published
          </label>
        </div>

        <div class="form-group">
          <label for="metaDescription">Meta Description</label>
          <textarea id="metaDescription" rows="2"></textarea>
        </div>

        <div class="form-group">
          <label for="metaKeywords">Meta Keywords</label>
          <input type="text" id="metaKeywords" placeholder="keyword1, keyword2, keyword3">
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
          <button type="submit" class="btn btn-success" style="flex: 1;">
            <i class="bi bi-save"></i> Save Blog
          </button>
          <button type="button" class="btn btn-secondary" onclick="closeModal()" style="flex: 1;">
            Cancel
          </button>
        </div>
      </form>
    </div>
  </div>

  <style>
    /* API Key Modal Styles */
    #apiKeyModal {
      display: flex;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 10000;
      align-items: center;
      justify-content: center;
    }
    
    #apiKeyModal.hidden {
      display: none;
    }
    
    .api-key-modal-content {
      background: white;
      padding: 2.5rem;
      border-radius: 16px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.3s ease-out;
    }
    
    @keyframes slideIn {
      from {
        transform: translateY(-20px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
    
    .api-key-modal-content h2 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 1rem;
      color: #1a1a1a;
    }
    
    .api-key-modal-content p {
      color: #6c757d;
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }
    
    .api-key-input {
      width: 100%;
      padding: 1rem;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 1rem;
      font-family: 'Courier New', monospace;
      margin-bottom: 1.5rem;
      transition: border-color 0.3s;
    }
    
    .api-key-input:focus {
      outline: none;
      border-color: #4A1DE1;
    }
    
    .api-key-buttons {
      display: flex;
      gap: 1rem;
    }
    
    .api-key-buttons button {
      flex: 1;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .api-key-submit {
      background: #4A1DE1;
      color: white;
    }
    
    .api-key-submit:hover {
      background: #3000D2;
    }
    
    .api-key-cancel {
      background: #e5e7eb;
      color: #1a1a1a;
    }
    
    .api-key-cancel:hover {
      background: #d1d5db;
    }
  </style>
  
  <!-- API Key Modal -->
  <div id="apiKeyModal" class="hidden">
    <div class="api-key-modal-content">
      <h2><i class="bi bi-shield-lock"></i> Admin Authentication</h2>
      <p>Please enter your Admin API Key to access the blog management system.</p>
      <input type="password" id="apiKeyInput" class="api-key-input" placeholder="Enter Admin API Key" autofocus>
      <div class="api-key-buttons">
        <button class="api-key-submit" onclick="submitApiKey()">Continue</button>
        <button class="api-key-cancel" onclick="cancelApiKey()">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = '/api/blogs';
    let ADMIN_API_KEY = null;
    let currentTags = [];
    
    // Show API key modal on page load
    function showApiKeyModal() {
      document.getElementById('apiKeyModal').classList.remove('hidden');
      document.getElementById('apiKeyInput').focus();
    }
    
    function submitApiKey() {
      const key = document.getElementById('apiKeyInput').value.trim();
      if (key) {
        ADMIN_API_KEY = key;
        document.getElementById('apiKeyModal').classList.add('hidden');
        loadBlogs();
      } else {
        alert('Please enter an API key');
      }
    }
    
    function cancelApiKey() {
      document.getElementById('apiKeyModal').classList.add('hidden');
      alert('API key is required to access the admin panel.');
    }
    
    // Handle Enter key in API key input
    document.addEventListener('DOMContentLoaded', function() {
      const apiKeyInput = document.getElementById('apiKeyInput');
      if (apiKeyInput) {
        apiKeyInput.addEventListener('keypress', function(e) {
          if (e.key === 'Enter') {
            submitApiKey();
          }
        });
      }
      showApiKeyModal();
    });

    async function loadBlogs() {
      if (!ADMIN_API_KEY) {
        showApiKeyModal();
        return;
      }
      
      const container = document.getElementById('blogs-container');
      container.innerHTML = '<p class="loading">Loading blogs...</p>';

      try {
        const response = await fetch(API_BASE);
        
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const data = await response.json();
        
        if (data.blogs && data.blogs.length > 0) {
          container.innerHTML = '<div class="blogs-grid"></div>';
          const grid = container.querySelector('.blogs-grid');
          
          data.blogs.forEach(blog => {
            const card = createBlogCard(blog);
            grid.appendChild(card);
          });
        } else {
          container.innerHTML = `
            <div class="empty-state">
              <i class="bi bi-journal-x"></i>
              <h3>No blogs found</h3>
              <p>Create your first blog post to get started!</p>
            </div>
          `;
        }
      } catch (error) {
        container.innerHTML = `<div class="alert alert-error">Error loading blogs: ${error.message}</div>`;
      }
    }

    function createBlogCard(blog) {
      const card = document.createElement('div');
      card.className = 'blog-card';
      
      const imageUrl = blog.featured_image_url || 'https://via.placeholder.com/400x200?text=No+Image';
      const publishedBadge = blog.published ? '<span style="background: #15be56; color: white; padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.75rem;">Published</span>' : '<span style="background: #ee6c20; color: white; padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.75rem;">Draft</span>';
      
      card.innerHTML = `
        <img src="${imageUrl}" alt="${blog.title}">
        <h3>${blog.title}</h3>
        <div class="meta">
          <div>${publishedBadge}</div>
          <div>By ${blog.author || 'Stephen Mulingwa'}</div>
          <div>${blog.category || 'Uncategorized'}</div>
          <div>${new Date(blog.created_at).toLocaleDateString()}</div>
        </div>
        <div class="actions">
          <button class="btn btn-primary" onclick="editBlog(${blog.id})">
            <i class="bi bi-pencil"></i> Edit
          </button>
          <button class="btn btn-danger" onclick="deleteBlog(${blog.id})">
            <i class="bi bi-trash"></i> Delete
          </button>
        </div>
      `;
      
      return card;
    }

    function openCreateModal() {
      document.getElementById('modalTitle').textContent = 'Create New Blog';
      document.getElementById('blogForm').reset();
      document.getElementById('blogId').value = '';
      document.getElementById('imagePreview').classList.remove('active');
      document.getElementById('imageUploadText').style.display = 'block';
      currentTags = [];
      updateTagsDisplay();
      document.getElementById('blogModal').classList.add('active');
    }

    function editBlog(id) {
      fetch(`${API_BASE}?id=${id}`)
        .then(res => res.json())
        .then(blog => {
          document.getElementById('modalTitle').textContent = 'Edit Blog';
          document.getElementById('blogId').value = blog.id;
          document.getElementById('title').value = blog.title;
          document.getElementById('excerpt').value = blog.excerpt || '';
          document.getElementById('content').value = blog.content;
          document.getElementById('author').value = blog.author || 'Stephen Mulingwa';
          document.getElementById('category').value = blog.category || '';
          document.getElementById('published').checked = blog.published;
          document.getElementById('metaDescription').value = blog.meta_description || '';
          document.getElementById('metaKeywords').value = blog.meta_keywords || '';
          
          if (blog.featured_image_url) {
            document.getElementById('featuredImageUrl').value = blog.featured_image_url;
            document.getElementById('previewImg').src = blog.featured_image_url;
            document.getElementById('imagePreview').classList.add('active');
            document.getElementById('imageUploadText').style.display = 'none';
          }
          
          currentTags = blog.tags || [];
          updateTagsDisplay();
          
          document.getElementById('blogModal').classList.add('active');
        })
        .catch(error => {
          showAlert('Error loading blog: ' + error.message, 'error');
        });
    }

    async function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async (e) => {
        const base64 = e.target.result;
        
        try {
          const response = await fetch('/api/upload-image', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${ADMIN_API_KEY}`
            },
            body: JSON.stringify({ image: base64 })
          });

          const data = await response.json();
          
          if (data.url) {
            document.getElementById('featuredImageUrl').value = data.url;
            document.getElementById('previewImg').src = data.url;
            document.getElementById('imagePreview').classList.add('active');
            document.getElementById('imageUploadText').style.display = 'none';
            showAlert('Image uploaded successfully!', 'success');
          } else {
            showAlert('Failed to upload image', 'error');
          }
        } catch (error) {
          showAlert('Error uploading image: ' + error.message, 'error');
        }
      };
      reader.readAsDataURL(file);
    }

    function addTag(event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        const tag = event.target.value.trim();
        if (tag && !currentTags.includes(tag)) {
          currentTags.push(tag);
          updateTagsDisplay();
          event.target.value = '';
        }
      }
    }

    function removeTag(tag) {
      currentTags = currentTags.filter(t => t !== tag);
      updateTagsDisplay();
    }

    function updateTagsDisplay() {
      const container = document.getElementById('tagsContainer');
      const existingTags = container.querySelectorAll('.tag');
      existingTags.forEach(tag => tag.remove());
      
      currentTags.forEach(tag => {
        const tagEl = document.createElement('span');
        tagEl.className = 'tag';
        tagEl.innerHTML = `${tag} <span class="remove" onclick="removeTag('${tag}')">&times;</span>`;
        container.insertBefore(tagEl, document.getElementById('tagInput'));
      });
    }

    async function saveBlog(event) {
      event.preventDefault();
      
      if (!ADMIN_API_KEY) {
        showAlert('Please enter your API key first', 'error');
        showApiKeyModal();
        return;
      }
      
      const id = document.getElementById('blogId').value;
      const blogData = {
        title: document.getElementById('title').value,
        excerpt: document.getElementById('excerpt').value,
        content: document.getElementById('content').value,
        featured_image_url: document.getElementById('featuredImageUrl').value || null,
        author: document.getElementById('author').value,
        category: document.getElementById('category').value,
        tags: currentTags,
        published: document.getElementById('published').checked,
        meta_description: document.getElementById('metaDescription').value,
        meta_keywords: document.getElementById('metaKeywords').value
      };

      try {
        const url = id ? `${API_BASE}-admin?id=${id}` : `${API_BASE}-admin`;
        const method = id ? 'PUT' : 'POST';
        
        const response = await fetch(url, {
          method: method,
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${ADMIN_API_KEY}`
          },
          body: JSON.stringify(blogData)
        });

        const data = await response.json();
        
        if (response.ok) {
          showAlert(id ? 'Blog updated successfully!' : 'Blog created successfully!', 'success');
          closeModal();
          loadBlogs();
        } else {
          showAlert(data.error || 'Failed to save blog', 'error');
        }
      } catch (error) {
        showAlert('Error saving blog: ' + error.message, 'error');
      }
    }

    async function deleteBlog(id) {
      if (!confirm('Are you sure you want to delete this blog?')) return;

      try {
        const response = await fetch(`${API_BASE}-admin?id=${id}`, {
          method: 'DELETE',
          headers: {
            'Authorization': `Bearer ${ADMIN_API_KEY}`
          }
        });

        if (response.ok) {
          showAlert('Blog deleted successfully!', 'success');
          loadBlogs();
        } else {
          const data = await response.json();
          showAlert(data.error || 'Failed to delete blog', 'error');
        }
      } catch (error) {
        showAlert('Error deleting blog: ' + error.message, 'error');
      }
    }

    function closeModal() {
      document.getElementById('blogModal').classList.remove('active');
    }

    function showAlert(message, type) {
      const container = document.getElementById('alert-container');
      const alert = document.createElement('div');
      alert.className = `alert alert-${type}`;
      alert.textContent = message;
      container.appendChild(alert);
      
      setTimeout(() => {
        alert.remove();
      }, 5000);
    }

    // Don't load blogs until API key is entered
    // loadBlogs() will be called after API key is submitted
  </script>
</body>
</html>
