<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article | TaiStat Blog</title>
  <meta name="description" content="TaiStat blog article">
  <meta name="robots" content="index, follow">
  <link rel="icon" href="/assets/img/tailogo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="/assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="/assets/css/case-study.css" rel="stylesheet">
</head>
<body class="case-study-page">

<nav class="navbar" id="navbar">
  <div class="container navbar-inner">
    <a href="/home" class="nav-logo">
      <img src="/assets/img/tailogo.png" alt="TaiStat">
      <span class="nav-logo-text">Tai<span>Stat</span></span>
    </a>
    <ul class="nav-links">
      <li><a href="/home">Home</a></li>
      <li><a href="/ai">AI</a></li>
      <li><a href="/services">Services</a></li>
      <li><a href="/portfolio">Portfolio</a></li>
      <li><a href="/blog" class="active">Blog</a></li>
      <li><a href="/about-us">About Us</a></li>
      <li><a href="/contact">Contact</a></li>
    </ul>
    <div class="nav-cta">
      <a href="/contact" class="nav-cta-btn"><i class="bi bi-rocket-takeoff"></i> Get Started</a>
    </div>
    <button class="nav-hamburger" id="hamburger" type="button" aria-label="Toggle menu" aria-expanded="false">
      <i class="bi bi-list" id="hamburgerIcon"></i>
    </button>
  </div>
  <div class="nav-mobile" id="mobileMenu">
    <a href="/home">Home</a>
    <a href="/ai">AI</a>
    <a href="/services">Services</a>
    <a href="/portfolio">Portfolio</a>
    <a href="/blog">Blog</a>
    <a href="/about-us">About Us</a>
    <a href="/contact">Contact</a>
    <a href="/contact" class="nav-cta-btn">Get Started</a>
  </div>
</nav>

<div id="ad-loading" class="loading-screen">
  <p>Loading article…</p>
</div>
<div id="ad-error" class="error-screen" style="display:none;">
  <p>Article not found.</p>
  <a href="/blog" class="btn btn-primary" style="margin-top:1rem;">Back to blog</a>
</div>
<div id="ad-app" style="display:none;"></div>

<footer class="site-footer">
  <div class="container footer-inner">
    <nav class="footer-nav">
      <a href="/home">Home</a>
      <a href="/blog">Blog</a>
      <a href="/portfolio">Portfolio</a>
      <a href="/contact">Contact</a>
    </nav>
    <div class="footer-social">
      <a href="https://www.linkedin.com/company/taistat-consultancy-firm/" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="LinkedIn"><i class="bi bi-linkedin"></i></a>
      <a href="https://www.facebook.com/TaiStatFirm" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
    </div>
    <p class="footer-copy">© TaiStat Firm · All rights reserved</p>
    <button type="button" class="scroll-top-btn" id="scrollTopBtn" aria-label="Scroll to top">
      <i class="bi bi-arrow-up-short"></i>
    </button>
  </div>
</footer>

<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  let slug = params.get('slug');
  if (!slug) {
    const parts = window.location.pathname.split('/').filter(Boolean);
    slug = parts[parts.length - 1];
  }

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]);
    });
  }
  function escAttr(s) { return String(s ?? '').replace(/"/g, '&quot;'); }

  function looksLikeHtml(str) {
    const t = String(str || '').trim();
    return /^<[a-z!]/i.test(t) || /<\/[a-z]/i.test(t) || /<br\s*\/?>/i.test(t);
  }

  function paragraphs(text) {
    return String(text || '')
      .split(/\n+/)
      .map(function (p) { return p.trim(); })
      .filter(Boolean)
      .map(function (p) { return '<p>' + esc(p) + '</p>'; })
      .join('');
  }

  function titleHtml(title) {
    const w = String(title || '').trim().split(/\s+/).filter(Boolean);
    if (w.length < 2) return esc(title || 'Article');
    const last = w.pop();
    return esc(w.join(' ')) + ' <span class="text-gradient">' + esc(last) + '</span>';
  }

  function readingMins(text) {
    const words = String(text || '').replace(/<[^>]+>/g, ' ').split(/\s+/).filter(Boolean).length;
    return Math.max(1, Math.round(words / 220));
  }

  function tagChips(tags) {
    if (!tags || !tags.length) return '';
    return tags.slice(0, 5).map(function (t) {
      return '<span class="meta-chip"><i class="bi bi-bookmark"></i> ' + esc(t) + '</span>';
    }).join('');
  }

  async function loadRelated(currentSlug, container) {
    try {
      const res = await fetch('/api/blogs?limit=8');
      const data = await res.json();
      const blogs = (data.blogs || []).filter(function (b) { return (b.slug || '') !== currentSlug; }).slice(0, 4);
      if (!blogs.length) {
        container.innerHTML = '<p style="color:var(--text-muted);font-size:0.88rem;">No other posts yet.</p>';
        return;
      }
      container.innerHTML =
        '<div class="related-list">' +
        blogs.map(function (b) {
          const s = b.slug || 'post-' + b.id;
          const th = b.featured_image_url
            ? '<img class="related-thumb" src="' + escAttr(b.featured_image_url) + '" alt="" loading="lazy">'
            : '<div class="related-thumb"></div>';
          return (
            '<a href="/blog/' + encodeURIComponent(s) + '">' +
            th +
            '<span class="related-title">' + esc(b.title) + '</span></a>'
          );
        }).join('') +
        '</div>';
    } catch (e) {
      container.innerHTML = '<p style="color:var(--text-muted);font-size:0.88rem;">Could not load related posts.</p>';
    }
  }

  function splitPlainSections(text) {
    const lines = String(text || '').split(/\n+/).map(function (l) { return l.trim(); }).filter(Boolean);
    if (!lines.length) return [];
    const headingRe = /^(the\s+problem|problem|challenge|overview|context|what\s+we\s+(built|recommend|did)|solution|approach|outcome|results?|key\s+takeaways?|summary|conclusion)\b[:\s-]*/i;
    const sections = [];
    let current = { title: 'Overview', body: [] };
    lines.forEach(function (line) {
      const m = line.match(headingRe);
      if (m && line.length < 80) {
        if (current.body.length) sections.push(current);
        current = { title: line.replace(/[:\-]+$/, '').trim(), body: [] };
      } else {
        current.body.push(line);
      }
    });
    if (current.body.length) sections.push(current);
    return sections;
  }

  function sectionIcon(title) {
    const t = title.toLowerCase();
    if (/problem|challenge/.test(t)) return { bg: 'rgba(239,68,68,0.1)', color: '#ef4444', icon: 'bi-exclamation-circle' };
    if (/built|solution|approach|recommend|did/.test(t)) return { bg: 'rgba(45,212,191,0.1)', color: 'var(--primary)', icon: 'bi-cpu' };
    if (/outcome|result/.test(t)) return { bg: 'rgba(16,185,129,0.1)', color: '#10b981', icon: 'bi-graph-up-arrow' };
    if (/takeaway|key/.test(t)) return { bg: 'rgba(99,102,241,0.1)', color: '#6366f1', icon: 'bi-lightbulb' };
    return { bg: 'rgba(45,212,191,0.1)', color: 'var(--primary)', icon: 'bi-journal-text' };
  }

  function buildMainBlocks(blog) {
    const raw = blog.content || '';
    let blocks = '';

    if (blog.excerpt) {
      blocks +=
        '<div class="project-block fade-up">' +
        '<h3><span class="block-icon" style="background:rgba(45,212,191,0.1);color:var(--primary)"><i class="bi bi-bookmark-check"></i></span> Overview</h3>' +
        '<p>' + esc(blog.excerpt) + '</p></div>';
    }

    if (looksLikeHtml(raw)) {
      blocks +=
        '<div class="project-block fade-up delay-1">' +
        '<h3><span class="block-icon" style="background:rgba(45,212,191,0.1);color:var(--primary)"><i class="bi bi-journal-richtext"></i></span> Article</h3>' +
        '<div class="article-prose">' + raw + '</div></div>';
    } else {
      const sections = splitPlainSections(raw);
      if (sections.length <= 1) {
        blocks +=
          '<div class="project-block fade-up delay-1">' +
          '<h3><span class="block-icon" style="background:rgba(45,212,191,0.1);color:var(--primary)"><i class="bi bi-journal-text"></i></span> Deep Dive</h3>' +
          '<div class="article-prose">' + paragraphs(raw) + '</div></div>';
      } else {
        sections.forEach(function (sec, i) {
          const ic = sectionIcon(sec.title);
          blocks +=
            '<div class="project-block fade-up' + (i ? ' delay-' + Math.min(i, 3) : '') + '">' +
            '<h3><span class="block-icon" style="background:' + ic.bg + ';color:' + ic.color + '"><i class="bi ' + ic.icon + '"></i></span> ' +
            esc(sec.title) + '</h3>' +
            '<div class="article-prose">' + sec.body.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') + '</div></div>';
        });
      }
    }

    const tags = blog.tags || [];
    if (tags.length) {
      blocks +=
        '<div class="project-block fade-up">' +
        '<h3><span class="block-icon" style="background:rgba(99,102,241,0.1);color:#6366f1"><i class="bi bi-lightbulb"></i></span> Key Themes</h3>' +
        '<div class="pipeline">' +
        tags.slice(0, 6).map(function (t, i) {
          const icons = ['bi-tag', 'bi-diagram-3', 'bi-bar-chart-line', 'bi-gear', 'bi-shield-check', 'bi-stars'];
          return (
            '<div class="pipeline-step"><i class="bi ' + icons[i % icons.length] + '"></i>' +
            '<strong>' + esc(t) + '</strong><span>Focus area</span></div>'
          );
        }).join('') +
        '</div></div>';
    }

    blocks +=
      '<div class="project-block fade-up">' +
      '<h3><span class="block-icon" style="background:rgba(16,185,129,0.1);color:#10b981"><i class="bi bi-rocket-takeoff"></i></span> Next Steps with TaiStat</h3>' +
      '<p>If this topic maps to a challenge in your organisation — data products, AI workflows, or agriculture platforms — we can help scope a practical next step.</p>' +
      '<ul>' +
      '<li>Clarify the business problem and success metrics</li>' +
      '<li>Shape a lean build or analytics roadmap</li>' +
      '<li>Ship measurable outcomes, not slide decks alone</li>' +
      '</ul>' +
      '<div class="sidebar-actions" style="margin-top:18px;flex-direction:row;flex-wrap:wrap">' +
      '<a href="/contact" class="btn btn-primary"><i class="bi bi-chat-dots"></i> Talk to Us</a>' +
      '<a href="/portfolio" class="btn btn-outline"><i class="bi bi-briefcase"></i> See Portfolio</a>' +
      '</div></div>';

    return blocks;
  }

  function render(blog) {
    document.title = esc(blog.title) + ' | TaiStat Blog';
    if (blog.meta_description) {
      var m = document.querySelector('meta[name="description"]');
      if (!m) {
        m = document.createElement('meta');
        m.name = 'description';
        document.head.appendChild(m);
      }
      m.content = blog.meta_description;
    }

    const raw = blog.content || '';
    const dateStr = new Date(blog.published_at || blog.created_at).toLocaleDateString('en-US', {
      year: 'numeric', month: 'short', day: 'numeric'
    });
    const mins = readingMins(raw);
    const imgUrl = blog.featured_image_url || 'https://placehold.co/960x420/060d14/2dd4bf?text=TaiStat';
    const chips = tagChips(blog.tags || []);
    const techTags = (blog.tags || []).map(function (t) {
      return '<span class="tag">#' + esc(t) + '</span>';
    }).join('');

    const sidebar =
      '<aside class="project-sidebar">' +
      '<div class="sidebar-card fade-up">' +
      '<h4>Article Details</h4>' +
      '<div class="sidebar-row"><span class="label">Author</span><span class="value">' + esc(blog.author || 'Stephen Mulingwa') + '</span></div>' +
      (blog.category ? '<div class="sidebar-row"><span class="label">Category</span><span class="value">' + esc(blog.category) + '</span></div>' : '') +
      '<div class="sidebar-row"><span class="label">Published</span><span class="value">' + esc(dateStr) + '</span></div>' +
      '<div class="sidebar-row"><span class="label">Read time</span><span class="value">' + mins + ' min</span></div>' +
      '<div class="sidebar-row"><span class="label">Type</span><span class="value">Insight</span></div>' +
      '</div>' +
      (techTags
        ? '<div class="sidebar-card fade-up delay-1"><h4>Topics</h4><div class="tools-tags">' + techTags + '</div></div>'
        : '') +
      '<div class="sidebar-card fade-up delay-1">' +
      '<h4>More Articles</h4>' +
      '<div id="related-posts"></div>' +
      '</div>' +
      '<div class="sidebar-card fade-up delay-2">' +
      '<h4>Actions</h4>' +
      '<div class="sidebar-actions">' +
      '<a href="/contact" class="btn btn-primary"><i class="bi bi-chat-dots"></i> Talk to Us</a>' +
      '<a href="/blog" class="btn btn-outline"><i class="bi bi-arrow-left"></i> All Articles</a>' +
      '</div></div>' +
      '</aside>';

    const html =
      '<section class="page-hero">' +
      '<div class="container page-hero-inner">' +
      '<div class="breadcrumb">' +
      '<a href="/home">Home</a><i class="bi bi-chevron-right"></i>' +
      '<a href="/blog">Blog</a><i class="bi bi-chevron-right"></i>' +
      '<span class="current">' + esc(blog.title) + '</span></div>' +
      '<h1>' + titleHtml(blog.title) + '</h1>' +
      (blog.excerpt ? '<p class="page-hero-tagline">' + esc(blog.excerpt) + '</p>' : '') +
      '<div class="hero-meta-inline">' +
      '<span><i class="bi bi-person"></i>' + esc(blog.author || 'Stephen Mulingwa') + '</span>' +
      '<span><i class="bi bi-calendar3"></i>' + esc(dateStr) + '</span>' +
      '<span><i class="bi bi-clock"></i>' + mins + ' min read</span>' +
      '</div>' +
      (chips ? '<div class="hero-meta-chips" style="margin-top:16px">' + chips + '</div>' : '') +
      '</div></section>' +
      '<div class="project-image-wrap">' +
      '<div class="project-image-frame fade-up">' +
      '<img src="' + escAttr(imgUrl) + '" alt="' + escAttr(blog.title) + '" onerror="this.src=\'' + escAttr('https://placehold.co/960x420/060d14/2dd4bf?text=TaiStat') + '\'">' +
      '</div></div>' +
      '<section class="project-content"><div class="project-layout"><div>' +
      buildMainBlocks(blog) +
      '</div>' +
      sidebar +
      '</div></section>';

    document.getElementById('ad-app').innerHTML = html;
    document.getElementById('ad-app').style.display = 'block';

    document.querySelectorAll('.fade-up').forEach(function (el) { el.classList.add('visible'); });

    loadRelated(blog.slug || slug, document.getElementById('related-posts'));
  }

  async function load() {
    if (!slug) {
      document.getElementById('ad-loading').style.display = 'none';
      document.getElementById('ad-error').style.display = 'flex';
      return;
    }
    try {
      var res = await fetch('/api/blogs?slug=' + encodeURIComponent(slug));
      if (!res.ok) throw new Error('nf');
      var blog = await res.json();
      document.getElementById('ad-loading').style.display = 'none';
      render(blog);
    } catch (e) {
      document.getElementById('ad-loading').style.display = 'none';
      document.getElementById('ad-error').style.display = 'flex';
    }
  }

  document.getElementById('hamburger').addEventListener('click', function () {
    var m = document.getElementById('mobileMenu');
    var ic = document.getElementById('hamburgerIcon');
    var open = m.classList.toggle('open');
    ic.className = open ? 'bi bi-x-lg' : 'bi bi-list';
    this.setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  document.getElementById('scrollTopBtn').addEventListener('click', function () {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  document.addEventListener('DOMContentLoaded', load);
})();
</script>
</body>
</html>
